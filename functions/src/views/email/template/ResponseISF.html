<!DOCTYPE html>
<body>
    <div id="result" class="result" style="display: block">
        <h3>{{spanTitle}}</h3>
        <div class="{{className}}">
            <p>{{descriptionLevel}}</p>
        </div>
        <div class="recommendations">
            <h4>O que isso significa</h4>
            <p>{{what}}</p>
        </div>
        {{#if hasPlan}}
        <div class="recommendations">
            <h4>Próximos passos sugeridos</h4>
            <p>{{descPlan}}</p>
            <ul>
            {{#plan}}
                <li>{{desc}}</li>
            {{/plan}}
            </ul>
        </div>
        {{else}}
        <div class="recommendations">
            <p>{{descPlan}}</p>
        </div>
        {{/if}}
        {{#if footer}}
        <div class="cta-section">
            <p>{{footer}}</p>
        </div>
        {{/if}}
    </div>
</body>

<style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #000000;
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  background: #ffffff;
  border-radius: 2px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
  overflow: hidden;
}

.header {
  background: #000000;
  color: #ffffff;
  padding: 50px 40px;
  text-align: center;
  border-bottom: 3px solid #32d74b;
}

.header h1 {
  font-size: 2.8em;
  margin-bottom: 15px;
  font-weight: 300;
  letter-spacing: -1px;
}

.header p {
  font-size: 1.2em;
  opacity: 0.8;
  max-width: 700px;
  margin: 0 auto;
  font-weight: 300;
  line-height: 1.4;
}

.content {
  padding: 50px 40px;
}

.result {
  margin-top: 50px;
  padding: 40px;
  border-radius: 0;
  text-align: center;
  font-weight: 500;
  font-size: 1.1em;
  display: none;
  animation: fadeIn 0.4s ease-in;
  border: 2px solid #32d74b;
  background: #ffffff;
  color: #000000;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.result h3 {
  margin-bottom: 20px;
  font-size: 1.8em;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.result p {
  line-height: 1.7;
  margin-bottom: 20px;
  font-size: 1.1em;
  font-weight: 400;
}

.risk-assessment {
  background: #fff3cd;
  border: 1px solid #ffeaa7;
  padding: 20px;
  margin: 20px 0;
  border-left: 4px solid #fdcb6e;
}

.risk-assessment.high_risk {
  background: #f8d7da;
  border: 1px solid #f5c6cb;
  border-left: 4px solid #e74c3c;
}

.risk-assessment.medium-risk {
  background: #fff3cd;
  border: 1px solid #ffeaa7;
  border-left: 4px solid #f39c12;
}

.risk-assessment.low-risk {
  background: #d4edda;
  border: 1px solid #c3e6cb;
  border-left: 4px solid #27ae60;
}

.recommendations {
  background: #f8f9fa;
  padding: 35px;
  border-radius: 0;
  margin-top: 30px;
  text-align: left;
  border-left: 4px solid #32d74b;
}

.recommendations h4 {
  color: #000000;
  margin-bottom: 20px;
  font-size: 1.3em;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.recommendations p {
  line-height: 1.7;
  font-size: 1em;
  font-weight: 400;
  color: #333333;
}

.recommendations ul {
  color: #333333;
  line-height: 1.8;
  padding-left: 20px;
  margin-top: 15px;
}

.recommendations li {
  margin-bottom: 15px;
  font-weight: 400;
}

.cta-section {
  background: #32d74b;
  color: #000000;
  padding: 30px;
  margin-top: 30px;
  text-align: center;
  font-weight: 600;
}

@media (max-width: 768px) {
  .container {
    margin: 10px;
    border-radius: 0;
  }

  .header {
    padding: 25px 20px;
  }

  .header h1 {
    font-size: 2em;
  }

  .content {
    padding: 25px 20px;
  }
}
</style>
